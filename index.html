<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nha Tro NMT - API Tester</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;
      color: #18212f;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 24px;
    }

    .api-config {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;

      display: flex;
      align-items: end;
      gap: 12px;
    }

    .api-config > div {
      flex: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(500px, 1fr) minmax(450px, 1fr);
      gap: 20px;
    }

    .left {
      display: grid;
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
    }

    .card h2 {
      font-size: 16px;
      margin: 0 0 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px 11px;

      border: 1px solid #d7dde7;
      border-radius: 8px;

      background: #ffffff;
      color: #111827;

      outline: none;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: #64748b;
      box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      font-family: Consolas, monospace;
    }

    .buttons {
      margin-top: 14px;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;

      padding: 9px 14px;

      background: #111827;
      color: white;

      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.88;
    }

    button.secondary {
      background: #64748b;
    }

    button.danger {
      background: #b91c1c;
    }

    button.success {
      background: #15803d;
    }

    .token-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;

      word-break: break-all;

      max-height: 90px;
      overflow: auto;

      font-family: Consolas, monospace;
      font-size: 11px;

      margin-bottom: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 5px 9px;
      border-radius: 999px;

      font-size: 12px;
      font-weight: 600;

      background: #e2e8f0;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .log-panel {
      background: #0f172a;
      border-radius: 14px;

      min-height: 700px;
      max-height: calc(100vh - 160px);

      position: sticky;
      top: 105px;

      overflow: hidden;
    }

    .log-header {
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      border-bottom: 1px solid #263244;

      color: white;
    }

    .log-header strong {
      font-size: 14px;
    }

    #log {
      margin: 0;
      padding: 16px;

      height: calc(100% - 52px);
      min-height: 650px;
      max-height: calc(100vh - 215px);

      overflow: auto;

      color: #d7e1f0;

      font-size: 12px;
      font-family:
        Consolas,
        "Courier New",
        monospace;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .small {
      color: #64748b;
      font-size: 12px;
      margin-top: 8px;
    }

    .user-info {
      background: #f8fafc;
      border-radius: 8px;

      padding: 12px;

      font-size: 13px;

      display: none;
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .log-panel {
        position: static;
      }
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .api-config {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 Nha Tro NMT — API Tester</h1>
  <p>Frontend test tạm thời cho NestJS + Prisma + PostgreSQL</p>
</header>

<div class="container">

  <!-- API CONFIG -->

  <div class="api-config">
    <div>
      <label>API Base URL</label>

      <input
        id="apiBase"
        value="http://localhost:3000/api"
      />
    </div>

    <button onclick="testApi()">
      Test API
    </button>

    <span id="apiStatus" class="status">
      Chưa kiểm tra
    </span>
  </div>

  <div class="layout">

    <!-- LEFT -->

    <div class="left">

      <!-- REGISTER -->

      <div class="card">

        <h2>1. Đăng ký</h2>

        <div class="form-grid">

          <div>
            <label>Họ tên</label>

            <input
              id="registerHoTen"
              value="Nguyen Van A"
            />
          </div>

          <div>
            <label>Số điện thoại</label>

            <input
              id="registerPhone"
              value="0912345678"
            />
          </div>

          <div>
            <label>Email</label>

            <input
              id="registerEmail"
              value="a@example.com"
            />
          </div>

          <div>
            <label>Mật khẩu</label>

            <input
              id="registerPassword"
              type="password"
              value="SecurePass123"
            />
          </div>

        </div>

        <div class="buttons">

          <button onclick="register()">
            Đăng ký
          </button>

        </div>

      </div>


      <!-- LOGIN -->

      <div class="card">

        <h2>2. Đăng nhập</h2>

        <div class="form-grid">

          <div>
            <label>Email</label>

            <input
              id="loginEmail"
              value="a@example.com"
            />
          </div>

          <div>
            <label>Mật khẩu</label>

            <input
              id="loginPassword"
              type="password"
              value="SecurePass123"
            />
          </div>

        </div>

        <div class="buttons">

          <button
            class="success"
            onclick="login()"
          >
            Đăng nhập
          </button>

          <button
            class="secondary"
            onclick="getCurrentUser()"
          >
            /auth/me
          </button>

          <button
            class="secondary"
            onclick="getCurrentTaiKhoan()"
          >
            /tai-khoan/me
          </button>

        </div>

        <div
          id="userInfo"
          class="user-info"
        ></div>

      </div>


      <!-- TOKENS -->

      <div class="card">

        <h2>3. Token</h2>

        <label>Access Token</label>

        <div
          id="accessTokenBox"
          class="token-box"
        >
          Chưa có
        </div>

        <label>Refresh Token</label>

        <div
          id="refreshTokenBox"
          class="token-box"
        >
          Chưa có
        </div>

        <div class="buttons">

          <button onclick="refreshToken()">
            Refresh Token
          </button>

          <button
            class="danger"
            onclick="logout()"
          >
            Đăng xuất
          </button>

          <button
            class="secondary"
            onclick="clearTokens()"
          >
            Xóa token local
          </button>

        </div>

      </div>


      <!-- ORGANIZATION -->

      <div class="card">

        <h2>4. Tổ chức</h2>

        <div class="form-grid">

          <div class="full">

            <label>Tên tổ chức</label>

            <input
              id="organizationName"
              value="Nha tro NMT"
            />

          </div>

        </div>

        <div class="buttons">

          <button onclick="createOrganization()">
            Tạo tổ chức
          </button>

          <button
            class="secondary"
            onclick="getOrganizations()"
          >
            Danh sách tổ chức
          </button>

        </div>

      </div>


      <!-- GET ORGANIZATION -->

      <div class="card">

        <h2>5. Lấy tổ chức theo ID</h2>

        <label>ID tổ chức</label>

        <input
          id="organizationId"
          placeholder="UUID tổ chức"
        />

        <div class="buttons">

          <button onclick="getOrganizationById()">
            GET tổ chức
          </button>

        </div>

      </div>


      <!-- RAW REQUEST -->

      <div class="card">

        <h2>6. Request tùy chỉnh</h2>

        <div class="form-grid">

          <div>
            <label>Method</label>

            <select id="customMethod">
              <option>GET</option>
              <option>POST</option>
              <option>PATCH</option>
              <option>PUT</option>
              <option>DELETE</option>
            </select>
          </div>

          <div>
            <label>Endpoint</label>

            <input
              id="customEndpoint"
              value="/auth/me"
            />
          </div>

          <div class="full">

            <label>JSON Body</label>

            <textarea id="customBody">{}</textarea>

          </div>

        </div>

        <div class="buttons">

          <button onclick="customRequest()">
            Gửi request
          </button>

        </div>

      </div>

    </div>


    <!-- LOG -->

    <div class="log-panel">

      <div class="log-header">

        <strong>Request / Response Log</strong>

        <button
          class="secondary"
          onclick="clearLog()"
        >
          Clear
        </button>

      </div>

      <pre id="log">Nha Tro NMT API Tester ready...</pre>

    </div>

  </div>

</div>


<script>

  // ============================================
  // STATE
  // ============================================

  let accessToken =
    localStorage.getItem("accessToken") || "";

  let refreshTokenValue =
    localStorage.getItem("refreshToken") || "";


  // ============================================
  // HELPERS
  // ============================================

  function apiBase() {

    return document
      .getElementById("apiBase")
      .value
      .replace(/\/$/, "");

  }


  function log(title, value) {

    const el = document.getElementById("log");

    const time =
      new Date().toLocaleTimeString();

    let output = value;

    if (typeof value !== "string") {

      try {

        output =
          JSON.stringify(value, null, 2);

      } catch {

        output =
          String(value);

      }

    }

    el.textContent +=
      `\n\n[${time}] ${title}\n${output}`;

    el.scrollTop =
      el.scrollHeight;

  }


  function updateTokenDisplay() {

    document.getElementById(
      "accessTokenBox"
    ).textContent =
      accessToken || "Chưa có";


    document.getElementById(
      "refreshTokenBox"
    ).textContent =
      refreshTokenValue || "Chưa có";

  }


  function saveTokens(
    newAccessToken,
    newRefreshToken
  ) {

    accessToken =
      newAccessToken || "";

    refreshTokenValue =
      newRefreshToken || "";


    if (accessToken) {

      localStorage.setItem(
        "accessToken",
        accessToken
      );

    }


    if (refreshTokenValue) {

      localStorage.setItem(
        "refreshToken",
        refreshTokenValue
      );

    }


    updateTokenDisplay();

  }


  function clearTokens() {

    accessToken = "";
    refreshTokenValue = "";

    localStorage.removeItem(
      "accessToken"
    );

    localStorage.removeItem(
      "refreshToken"
    );

    updateTokenDisplay();

    log(
      "TOKEN",
      "Token local đã được xóa."
    );

  }


  async function request(
    endpoint,
    options = {}
  ) {

    const url =
      `${apiBase()}${endpoint}`;


    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };


    if (
      options.auth !== false &&
      accessToken
    ) {

      headers.Authorization =
        `Bearer ${accessToken}`;

    }


    const fetchOptions = {
      method:
        options.method || "GET",

      headers
    };


    if (
      options.body !== undefined &&
      options.method !== "GET"
    ) {

      fetchOptions.body =
        JSON.stringify(options.body);

    }


    log(
      "REQUEST",
      {
        method: fetchOptions.method,
        url,
        body: options.body
      }
    );


    try {

      const response =
        await fetch(
          url,
          fetchOptions
        );


      let data;

      try {

        data =
          await response.json();

      } catch {

        data =
          await response.text();

      }


      log(
        `RESPONSE ${response.status}`,
        data
      );


      if (!response.ok) {

        throw {
          status: response.status,
          response: data
        };

      }


      return data;

    } catch (error) {

      log(
        "ERROR",
        error
      );

      throw error;

    }

  }


  // ============================================
  // API TEST
  // ============================================

  async function testApi() {

    const status =
      document.getElementById(
        "apiStatus"
      );


    try {

      await request(
        "",
        {
          auth: false
        }
      );


      status.textContent =
        "API online";

      status.className =
        "status ok";

    } catch {

      status.textContent =
        "API lỗi";

      status.className =
        "status error";

    }

  }


  // ============================================
  // REGISTER
  // ============================================

  async function register() {

    const body = {

      hoTen:
        document.getElementById(
          "registerHoTen"
        ).value,

      email:
        document.getElementById(
          "registerEmail"
        ).value,

      soDienThoai:
        document.getElementById(
          "registerPhone"
        ).value,

      matKhau:
        document.getElementById(
          "registerPassword"
        ).value

    };


    try {

      await request(
        "/auth/register",
        {
          method: "POST",
          body,
          auth: false
        }
      );

    } catch {}

  }


  // ============================================
  // LOGIN
  // ============================================

  async function login() {

    const body = {

      email:
        document.getElementById(
          "loginEmail"
        ).value,

      matKhau:
        document.getElementById(
          "loginPassword"
        ).value

    };


    try {

      const result =
        await request(
          "/auth/login",
          {
            method: "POST",
            body,
            auth: false
          }
        );


      const tokens =
        result.data || result;


      if (
        tokens.accessToken &&
        tokens.refreshToken
      ) {

        saveTokens(
          tokens.accessToken,
          tokens.refreshToken
        );

      }

    } catch {}

  }


  // ============================================
  // CURRENT USER
  // ============================================

  async function getCurrentUser() {

    try {

      const result =
        await request(
          "/auth/me"
        );


      showUser(
        result.data || result
      );

    } catch {}

  }


  async function getCurrentTaiKhoan() {

    try {

      const result =
        await request(
          "/tai-khoan/me"
        );


      showUser(
        result.data || result
      );

    } catch {}

  }


  function showUser(user) {

    const box =
      document.getElementById(
        "userInfo"
      );


    box.style.display =
      "block";


    box.innerHTML = `
      <strong>Đã đăng nhập</strong><br><br>

      ID:
      ${escapeHtml(user.id || "")}
      <br>

      Họ tên:
      ${escapeHtml(user.hoTen || "")}
      <br>

      Email:
      ${escapeHtml(user.email || "")}
      <br>

      SĐT:
      ${escapeHtml(
        user.soDienThoai || ""
      )}
    `;

  }


  // ============================================
  // REFRESH
  // ============================================

  async function refreshToken() {

    if (!refreshTokenValue) {

      log(
        "REFRESH",
        "Chưa có refresh token."
      );

      return;

    }


    try {

      const result =
        await request(
          "/auth/refresh",
          {
            method: "POST",
            auth: false,
            body: {
              refreshToken:
                refreshTokenValue
            }
          }
        );


      const tokens =
        result.data || result;


      saveTokens(
        tokens.accessToken,
        tokens.refreshToken
      );

    } catch {}

  }


  // ============================================
  // LOGOUT
  // ============================================

  async function logout() {

    try {

      await request(
        "/auth/logout",
        {
          method: "POST"
        }
      );


      clearTokens();


      document.getElementById(
        "userInfo"
      ).style.display =
        "none";

    } catch {}

  }


  // ============================================
  // ORGANIZATION
  // ============================================

  async function createOrganization() {

    const tenToChuc =
      document.getElementById(
        "organizationName"
      ).value;


    try {

      const result =
        await request(
          "/to-chuc",
          {
            method: "POST",
            body: {
              tenToChuc
            }
          }
        );


      const org =
        result.data || result;


      if (org.id) {

        document.getElementById(
          "organizationId"
        ).value =
          org.id;

      }

    } catch {}

  }


  async function getOrganizations() {

    try {

      await request(
        "/to-chuc"
      );

    } catch {}

  }


  async function getOrganizationById() {

    const id =
      document.getElementById(
        "organizationId"
      ).value.trim();


    if (!id) {

      log(
        "ERROR",
        "Chưa nhập organization ID."
      );

      return;

    }


    try {

      await request(
        `/to-chuc/${id}`
      );

    } catch {}

  }


  // ============================================
  // CUSTOM REQUEST
  // ============================================

  async function customRequest() {

    const method =
      document.getElementById(
        "customMethod"
      ).value;


    let endpoint =
      document.getElementById(
        "customEndpoint"
      ).value.trim();


    if (!endpoint.startsWith("/")) {

      endpoint =
        "/" + endpoint;

    }


    let body;


    if (
      !["GET", "DELETE"]
        .includes(method)
    ) {

      try {

        body =
          JSON.parse(
            document.getElementById(
              "customBody"
            ).value
          );

      } catch {

        log(
          "ERROR",
          "JSON Body không hợp lệ."
        );

        return;

      }

    }


    try {

      await request(
        endpoint,
        {
          method,
          body
        }
      );

    } catch {}

  }


  // ============================================
  // UTILITIES
  // ============================================

  function clearLog() {

    document.getElementById(
      "log"
    ).textContent =
      "Log cleared.";

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  updateTokenDisplay();

</script>

</body>
</html>
